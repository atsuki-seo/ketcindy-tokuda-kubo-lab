name: Build HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # KeTCindy 一式（KeTCindyJS のライブラリと Cindy.js）。CTAN の配布 zip を使う。
      - name: Cache KeTCindy
        id: cache-ketcindy
        uses: actions/cache@v4
        with:
          path: ~/ketcindy
          key: ketcindy-ctan-v1

      - name: Download KeTCindy
        if: steps.cache-ketcindy.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o ketcindy.zip https://ctan.csail.mit.edu/graphics/ketcindy.zip \
            || curl -fsSL --retry 3 -L -o ketcindy.zip https://mirrors.ctan.org/graphics/ketcindy.zip
          unzip -q ketcindy.zip -d "$RUNNER_TEMP/ketcindy-unzip"
          mv "$RUNNER_TEMP/ketcindy-unzip/ketcindy" ~/ketcindy

      - name: Build HTML
        run: |
          for f in src/*.cs; do
            node tools/ketjs-build.mjs "$f" build/html
          done

      - name: Make index.html
        run: node tools/make-index.mjs build/html

      # GitHub のランナーに入っている Google Chrome で開き、値を照合する
      - name: Verify in headless Chrome
        env:
          CHROME: /usr/bin/google-chrome
          CHROME_ARGS: --no-sandbox
        run: |
          node tools/ketjs-run.mjs build/html/nyquist_g4.html \
            --shot build/shot.png \
            --assert '=ReVal(1)|-0.005882|1e-5' \
            --assert '=ImVal(1)|-0.023529|1e-5' \
            --assert '=Gain(1)|0.024254|1e-5' \
            --assert '=length(ptList)|1501|0'
          # 入力欄の式（* を省略した書き方）で G(s) が変わること。4/((1+j)(2+j)) = 0.4 - 1.2j
          node tools/ketjs-run.mjs build/html/nyquist_g4.html \
            --shot build/shot-input.png \
            --eval 'Text0.currenttext="4/((s+1)(s+2))";' \
            --assert '=ReVal(1)|0.4|1e-6' \
            --assert '=ImVal(1)|-1.2|1e-6'

      # スマートフォン・タブレットの画面幅で全ページを開き、横スクロールが出ないことを確かめる
      - name: Verify layout on phone / tablet
        env:
          CHROME: /usr/bin/google-chrome
          CHROME_ARGS: --no-sandbox
        run: |
          mkdir -p build/shots
          for f in build/html/*.html; do
            name=$(basename "$f" .html)
            for v in 390x844 820x1180; do
              node tools/ketjs-run.mjs "$f" --viewport "$v" --shot "build/shots/$name-$v.png"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: html
          path: build/html
          if-no-files-found: error

      # Pages 用の成果物は main のときだけ作る（PR では公開しない）
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: |
            build/shot.png
            build/shots/
          if-no-files-found: ignore

  # GitHub Pages へ公開する（main へのプッシュ / 手動実行のときだけ）
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
